<!doctype html>
<meta charset="utf-8">
<!-- Nguồn của ảnh banner trong README. Dùng đúng token màu và font của app
     (frontend/src/styles/tokens.css) nên banner không "na ná" mà giống thật.
     Dựng lại: node tools/banner.mjs ở thư mục frontend. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f3ec; --surface:#fff; --ink:#1c1b19; --ink-2:#46423c; --ink-3:#655f56;
    --line-strong:#1c1b19; --shell:#18213a; --shell-2:#212b47; --accent:#d13b1f;
    --ok:#1f7a4c; --busy:#a3650c; --info:#2a4f93; --ink-on-dark:#f4f0e6;
    --display:'Archivo',sans-serif; --sans:'IBM Plex Sans',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1280px;height:360px;background:var(--paper);font-family:var(--sans);
       color:var(--ink);display:flex;overflow:hidden}
  .rail{width:96px;background:var(--shell);display:flex;flex-direction:column;
        align-items:center;gap:14px;padding:18px 0;flex:none}
  .brand{width:52px;height:52px;background:var(--accent);color:#fff;font-family:var(--display);
         font-weight:800;font-size:26px;display:grid;place-items:center;border:2px solid var(--line-strong)}
  .tile{width:52px;height:46px;background:var(--shell-2);border:2px solid #38446b;display:grid;place-items:center;font-family:var(--mono);
        font-size:9px;letter-spacing:.06em;color:var(--ink-on-dark);text-align:center;line-height:1.25}
  .body{flex:1;padding:38px 44px;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--ink-3)}
  h1{font-family:var(--display);font-weight:800;font-size:76px;line-height:.94;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{font-size:19px;color:var(--ink-2);max-width:760px;line-height:1.45}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .chip{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;
        padding:7px 13px;border:2px solid var(--line-strong);background:var(--surface)}
  .chip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
  .chip.busy{background:var(--busy);color:#fff;border-color:var(--busy)}
  .chip.info{background:var(--info);color:#fff;border-color:var(--info)}
  .chip.alert{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cta{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;
       padding:14px 26px;background:var(--ok);color:#fff;border:2px solid var(--line-strong);
       box-shadow:6px 6px 0 var(--line-strong)}
</style>
<div class="rail">
  <div class="brand">Y</div>
  <div class="tile">BÁN<br>HÀNG</div>
  <div class="tile">THỰC<br>ĐƠN</div>
  <div class="tile">BẾP</div>
  <div class="tile">THU<br>NGÂN</div>
</div>
<div class="body">
  <div class="kicker">SWP391 · FPT UNIVERSITY</div>
  <h1>RIMS <em>·</em> Yamazato</h1>
  <p class="sub">Hệ thống quản lý nội bộ nhà hàng: đặt bàn, gọi món, hàng bếp thời gian thực,
     thu ngân, hoá đơn và báo cáo doanh thu — năm vai, một ứng dụng.</p>
  <div class="row">
    <span class="chip ok">BÀN TRỐNG</span>
    <span class="chip busy">ĐANG PHỤC VỤ</span>
    <span class="chip info">ĐÃ ĐẶT TRƯỚC</span>
    <span class="chip alert">ĐÃ HUỶ</span>
    <span class="cta">XEM BẢN DEMO →</span>
  </div>
</div>
