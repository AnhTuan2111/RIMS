# Cấu hình cho test: H2 trong bộ nhớ, dựng lại schema mỗi lần chạy.
#
# Mọi giá trị ở đây đều là giá trị giả, cố ý ghi thẳng vào file và cố ý commit —
# không có gì bí mật để giấu. Trước đây dòng signerKey lại là KHOÁ KÝ JWT THẬT
# của môi trường phát triển, nên nó vừa nằm trong repo công khai vừa khiến token
# do test sinh ra ký được bằng khoá thật.
spring:
  datasource:
    url: jdbc:h2:mem:rims_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: test-only-not-a-secret
  # schema.sql và data.sql là SQL riêng của PostgreSQL (ON CONFLICT,
  # LOCALTIMESTAMP, generated by default as identity) — H2 ở chế độ PostgreSQL
  # không chạy trọn được. Test dựng lược đồ từ entity bằng ddl-auto: create-drop
  # nên không cần hai file đó; tắt hẳn để không kế thừa mode "always" ở
  # application.yaml.
  sql:
    init:
      mode: never
  jpa:
    # Ghi đè dialect của application.yaml: ở đây chạy H2, không phải PostgreSQL.
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  # Tối thiểu 32 ký tự, nếu không thư viện ký sẽ từ chối.
  signerKey: test-signer-key-for-unit-tests-only-32chars
